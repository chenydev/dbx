# Fork release: `gh release create <tag>` builds the DBX Web image and pushes
# it to GitHub Container Registry as ghcr.io/<owner>/<repo>:<tag> and :latest.
# Uses only the built-in GITHUB_TOKEN; no extra secrets are required.
name: GHCR Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build (e.g. v0.6.25-keys.1)
        required: true
      latest:
        description: Also tag the image as latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # One runner per architecture: the release profile uses fat LTO with a
  # single codegen unit, and building both targets on one runner runs out of
  # memory. Each job pushes by digest; `manifest` joins them under the tags.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The Rust release build of the whole workspace needs more disk than the
      # runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Private-repo runners have 2 vCPU / 7 GB RAM; swap absorbs link peaks.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # Fat LTO with one codegen unit needs far more memory than a 7 GB
          # runner has; thin LTO keeps the image build within limits.
          build-args: |
            CARGO_PROFILE_RELEASE_LTO=thin
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            CARGO_BUILD_JOBS=2
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ matrix.platform }}
          cache-to: type=gha,scope=ghcr-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    env:
      LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease || inputs.latest }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.LATEST == 'true' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # tag flags and digests are split on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.TAG }}"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
